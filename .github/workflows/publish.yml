name: 소름 자동 발행

# 발행 시각(KST) = cron(UTC) + 5분 여유 (at <= now 보장)
#   07:00 KST = 22:00 UTC(전날)   → 22:05
#   12:00 KST = 03:00 UTC          → 03:05
#   18:00 KST = 09:00 UTC          → 09:05
on:
  schedule:
    # 🔴 15분마다 폴링 (KST 발행창). GitHub 예약 크론은 개별적으로 지연·드롭된다
    # (2026-08-26: 아침 1시간 지연, 저녁 18:00 슬롯 완전 누락 → 009 수동 발행함).
    # publish.py가 due(at<=now) 미발행분을 다음 실행(≤15분)에 따라잡으므로,
    # 정확한 시각 크론 대신 자주 돌려서 드롭에 견딘다. (멱등 — 이미 발행분은 건너뜀)
    - cron: '*/15 22,23 * * *'   # UTC 22:00-23:59 = KST 07:00-08:59
    - cron: '*/15 0-10 * * *'    # UTC 00:00-10:59 = KST 09:00-19:59
  workflow_dispatch:
    inputs:
      dry_run:
        description: '1이면 발행 안 하고 대상만 확인'
        required: false
        default: '0'

# 발행 기록(yt_sent/ig_sent)을 저장소에 되커밋하려면 쓰기 권한 필요
permissions:
  contents: write

# 동시 실행 방지 (겹쳐서 중복 발행되는 것 차단)
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 발행 실행
        id: pub
        env:
          YT_CLIENT_SECRET_JSON: ${{ secrets.YT_CLIENT_SECRET_JSON }}
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: python publish.py

      - name: 발행 기록 커밋
        if: steps.pub.outputs.changed == 'true'
        run: |
          git config user.name "chills-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "발행 기록 갱신 + 발행완료 mp4 정리 [skip ci]" || echo "변경 없음"
          git push
